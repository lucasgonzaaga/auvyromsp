name: Supabase homologacao v0.4.2

on:
  push:
    branches: [feature/supabase-homologacao-v042]
  pull_request:
    branches: [prod]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auvyro-msp-servicedesk/package-lock.json
      - working-directory: auvyro-msp-servicedesk
        run: npm ci
      - working-directory: auvyro-msp-servicedesk
        run: npm test

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auvyro-msp-servicedesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auvyro-msp-servicedesk/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - run: npm ci
      - run: supabase start
      - run: supabase test db
      - name: Exportar configuração local sem persistir segredos
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY)"
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_APP_MODE=hosted"
          } >> "$GITHUB_ENV"
      - run: npm run build:hosted
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-homologacao
          path: auvyro-msp-servicedesk/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
