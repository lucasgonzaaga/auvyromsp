name: Auvyro MSP CI

on:
  push:
    branches:
      - prod
      - master
  pull_request:
    branches:
      - prod
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: auvyro-msp-servicedesk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auvyro-msp-servicedesk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and schema tests
        run: npm test

      - name: Run staging smoke unit tests
        run: npm run test:staging

  database:
    name: Supabase, hosted build and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: auvyro-msp-servicedesk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auvyro-msp-servicedesk/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Run pgTAP / RLS tests
        run: supabase test db

      - name: Export local public configuration
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=VITE_SUPABASE_URL \
            --override-name auth.anon_key=VITE_SUPABASE_ANON_KEY)"
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_APP_MODE=hosted"
          } >> "$GITHUB_ENV"

      - name: Build hosted application
        run: npm run build:hosted

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Supabase Auth browser E2E
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: auvyro-msp-servicedesk/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
